# Publishes the documentation site (https://nazmolla.github.io/xpp-vscode/docs/) from the wiki.
# The wiki is the source: every wiki edit (gollum event) rebuilds the site; site/build.py converts the pages for MkDocs.
name: Documentation site

on:
  gollum:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/docs.yml']

permissions:
  contents: write

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: main
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: |
          pip install --quiet mkdocs-material==9.8.2
          python main/site/build.py wiki src
          mkdocs build --strict -f src/mkdocs.yml -d "$GITHUB_WORKSPACE/out"
      - name: Publish to gh-pages/docs
        run: |
          rm -rf pages/docs
          cp -r out pages/docs
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Documentation site from wiki ${{ github.event_name }}"
          git push origin gh-pages
