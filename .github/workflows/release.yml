# Builds the extension from source, has the server signed by SignPath when signing is configured, and packages the VSIX.
# On a release tag (vX.Y.Z) the publish job creates the GitHub release with that VSIX and, when the secret VSCE_PAT is
# set, publishes it to the Visual Studio Marketplace; a manual run is a dry run of it (everything except publishing).
# The server compiles against Microsoft's Dynamics 365 compiler package, restored from the repository owner's PRIVATE
# GitHub Packages feed (it is never part of this repository, an artifact or the VSIX). The package grants this
# repository's Actions read access, so GITHUB_TOKEN is enough.
name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

env:
  COMPILER_PACKAGE: Microsoft.Dynamics.AX.Platform.CompilerPackage
  COMPILER_PACKAGE_VERSION: 7.0.7996.141

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore the Dynamics 365 compiler package (private feed)
        shell: pwsh
        env:
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nuget sources add -Name fno -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.actor }}" -Password $env:FEED_TOKEN -StorePasswordInClearText
          nuget install $env:COMPILER_PACKAGE -Version $env:COMPILER_PACKAGE_VERSION -Source fno -OutputDirectory "$env:RUNNER_TEMP\d365" -ExcludeVersion -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "XPP_BIN=$env:RUNNER_TEMP\d365\$env:COMPILER_PACKAGE" >> $env:GITHUB_ENV

      - run: npm ci

      - name: Build and test the server
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-server.ps1 -Test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-bridge-actions.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Never ship Microsoft assemblies
        shell: pwsh
        run: |
          $foreign = Get-ChildItem server/bin -Filter '*.dll'
          if ($foreign) { throw "server/bin must hold only F&O Studio's own files: $($foreign.Name -join ', ')" }
          $info = (Get-Item server/bin/XppVsCode.Server.exe).VersionInfo
          if ($info.ProductVersion -ne '${{ steps.version.outputs.version }}' -or $info.ProductName -ne 'F&O Studio for VS Code') {
            throw "Unexpected file metadata: $($info.ProductName) $($info.ProductVersion)"
          }

      - name: Build and test the extension
        shell: pwsh
        run: |
          npm run compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # @fno-studio/core (core/): no VS Code in it, and its unit tests (fake sign-in, recorded HTTP responses).
          npm run test:core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in 'scripts/source-test.js', 'scripts/form-preview-test.js', 'scripts/xpp-config-test.js', 'scripts/vs-tools-test.js') {
            node $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/build-agents.js --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/changelog.js --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the unsigned server
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: server-unsigned
          path: server/bin/XppVsCode.Server.exe
          if-no-files-found: error

      # Signing needs the SignPath project: variable SIGNPATH_ORGANIZATION_ID and secret SIGNPATH_API_TOKEN.
      # Every signing request waits for a manual approval in SignPath.
      - name: Sign the server (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: xpp-vscode
          signing-policy-slug: release-signing
          artifact-configuration-slug: server
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Use the signed server
        shell: pwsh
        run: |
          if (Test-Path signed/XppVsCode.Server.exe) {
            Copy-Item signed/XppVsCode.Server.exe server/bin/XppVsCode.Server.exe -Force
          }
          $signature = Get-AuthenticodeSignature server/bin/XppVsCode.Server.exe
          "Signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          # When signing is configured, a signing failure stops the release; without it the server ships unsigned.
          if ('${{ vars.SIGNPATH_ORGANIZATION_ID }}' -ne '' -and $env:GITHUB_REF_TYPE -eq 'tag' -and $signature.Status -ne 'Valid') {
            throw "The server is not signed ($($signature.Status)) although signing is configured."
          }
          if ('${{ vars.SIGNPATH_ORGANIZATION_ID }}' -eq '') {
            "::warning::Signing is not configured (variable SIGNPATH_ORGANIZATION_ID); the server ships unsigned."
          }

      # The server on its own (server/bin, with the signed exe when signing is configured) for hosts outside VS Code,
      # such as the Claude Code plugin, with its SHA-256. Never with a Microsoft assembly.
      - name: Package the server
        shell: pwsh
        run: |
          $zip = "fno-studio-server-${{ steps.version.outputs.version }}.zip"
          $foreign = Get-ChildItem server/bin -Recurse -File | Where-Object { $_.Extension -ieq '.dll' -or $_.Name -like 'Microsoft.Dynamics.*' }
          if ($foreign) { throw "server/bin must hold only F&O Studio's own files: $($foreign.Name -join ', ')" }
          Compress-Archive -Path server/bin/* -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $archive.Entries.FullName
            if ($names | Where-Object { $_ -like '*.dll' -or $_ -like '*Microsoft.Dynamics.*' }) { throw "$zip contains Microsoft assemblies." }
            if ($names -notcontains 'XppVsCode.Server.exe') { throw "$zip has no XppVsCode.Server.exe." }
            "Server zip: $($names -join ', ')"
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash  $zip`n")
          "SHA-256: $hash"

      - uses: actions/upload-artifact@v7
        with:
          name: server-zip
          path: |
            fno-studio-server-${{ steps.version.outputs.version }}.zip
            fno-studio-server-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Package the VSIX
        shell: pwsh
        run: |
          npm run build:tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Deploy and debugging convert PDBs with Pdb2Pdb: the VSIX must carry it, and it must run.
          if (-not (Test-Path tools/pdb2pdb/Pdb2Pdb.exe)) { throw 'Pdb2Pdb is missing; Deploy and debugging need it.' }
          $help = & tools/pdb2pdb/Pdb2Pdb.exe 2>&1 | Out-String
          $global:LASTEXITCODE = 0
          if ($help -notmatch '(?i)usage|pdb2pdb') { throw "Pdb2Pdb doesn't run: $help" }
          npx vsce package --readme-path docs/FEATURES.md --baseContentUrl https://github.com/nazmolla/xpp-vscode/blob/HEAD/docs --baseImagesUrl https://github.com/nazmolla/xpp-vscode/raw/HEAD/docs -o "xpp-vscode-${{ steps.version.outputs.version }}.vsix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: xpp-vscode-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

  # Publishes the VSIX the build job made (with the signed server) and creates the GitHub release with it.
  # Needs the secret VSCE_PAT: an Azure DevOps personal access token with the Marketplace (Manage) scope for publisher
  # MNazmi. Only a tag publishes; a manual run checks everything up to publishing.
  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - uses: actions/download-artifact@v8
        with:
          name: server-zip

      - name: The server zip matches its SHA-256
        shell: pwsh
        run: |
          $zip = "fno-studio-server-$env:VERSION.zip"
          $expected = ((Get-Content "$zip.sha256" -Raw) -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "$zip has SHA-256 $actual, expected $expected." }

      - name: The VSIX holds the signed server
        shell: pwsh
        run: |
          $vsix = "xpp-vscode-$env:VERSION.vsix"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsix))
          try {
            $entry = $zip.Entries | Where-Object FullName -eq 'extension/server/bin/XppVsCode.Server.exe'
            if (-not $entry) { throw "$vsix has no server." }
            $exe = Join-Path $env:RUNNER_TEMP 'XppVsCode.Server.exe'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $exe, $true)
            $foreign = $zip.Entries | Where-Object Name -like 'Microsoft.Dynamics.*.dll'
            if ($foreign) { throw "$vsix contains Microsoft assemblies: $($foreign.Name -join ', ')" }
            foreach ($required in 'extension/tools/pdb2pdb/Pdb2Pdb.exe', 'extension/changelog.md', 'extension/server/bin/XppVsCode.Server.exe.config', 'extension/core/dist/index.js') {
              if (-not ($zip.Entries | Where-Object FullName -eq $required)) { throw "$vsix is missing $required." }
            }
          } finally { $zip.Dispose() }
          $signature = Get-AuthenticodeSignature $exe
          $signer = $signature.SignerCertificate.Subject
          "Server signature: $($signature.Status) $signer"
          if ('${{ vars.SIGNPATH_ORGANIZATION_ID }}' -ne '' -and $env:RELEASE -eq 'true' -and ($signature.Status -ne 'Valid' -or $signer -notmatch 'SignPath Foundation')) {
            throw 'Signing is configured, so the server must carry a valid SignPath Foundation signature before it is published.'
          }

      - name: Release notes (What's new in docs/FEATURES.md)
        shell: pwsh
        run: |
          $minor = ($env:VERSION -split '\.')[0..1] -join '.'
          $lines = Get-Content docs/FEATURES.md
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -eq "## What's new in $minor" })
          if ($start -lt 0) { throw "docs/FEATURES.md has no section ""## What's new in $minor""." }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -like '## *' })
          if ($end -lt 0) { $end = $lines.Count }
          $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          $notes += "`n`nInstall from the [Visual Studio Marketplace](https://marketplace.visualstudio.com/items?itemName=MNazmi.xpp-vscode) or with the attached VSIX."
          Set-Content release-notes.md $notes -Encoding utf8
          Get-Content release-notes.md | Select-Object -First 5

      - name: GitHub release
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = "xpp-vscode-$env:VERSION.vsix", "fno-studio-server-$env:VERSION.zip", "fno-studio-server-$env:VERSION.zip.sha256"
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Re-running a tag's workflow updates its release instead of failing.
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:GITHUB_REF_NAME --title "F&O Studio $env:VERSION" --notes-file release-notes.md
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --title "F&O Studio $env:VERSION" --notes-file release-notes.md --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Needs the secret VSCE_PAT; without it the release stays on GitHub and the VSIX is published by hand.
      - name: Publish to the Visual Studio Marketplace
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if (-not $env:VSCE_PAT) {
            "::warning::The secret VSCE_PAT is not set: the Marketplace was not updated. Publish the release's VSIX with: npx vsce publish --packagePath xpp-vscode-$env:VERSION.vsix"
            exit 0
          }
          npx vsce publish --packagePath "xpp-vscode-$env:VERSION.vsix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dry run
        if: ${{ github.ref_type != 'tag' }}
        shell: pwsh
        run: |
          "Dry run: xpp-vscode-$env:VERSION.vsix would be published to the Marketplace and released as v$env:VERSION on a tag."
          "VSCE_PAT set: ${{ secrets.VSCE_PAT != '' }}"
